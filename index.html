<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Naveka · Menù</title>
<meta name="description" content="Menù digitale Pizzeria Naveka: pizze al metro, antipasti, primi, dolci e bevande.">
<meta name="theme-color" content="#4b2a7b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234b2a7b'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3En%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --teal: #4f9e97;
    --olive: #9da536;
    --purple: #4b2a7b;
    --pink: #c9546f;
    --lime: #8fb832;
    --chili: #8e1f1f;

    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #221b2b;
    --muted: #6e6677;
    --line: #e7e1d8;
    --accent: var(--purple);
    --chip: #ece6f3;
    --shadow: 0 1px 2px rgba(40, 20, 60, .06), 0 4px 14px rgba(40, 20, 60, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17131c;
      --card: #211b28;
      --ink: #f1ecf6;
      --muted: #a79fb2;
      --line: #342b3d;
      --accent: #b99ae6;
      --chip: #2e2539;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 118px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  /* ---------- header ---------- */
  .hero {
    padding: 22px 16px 18px;
    text-align: center;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: block; margin: 0 auto;
    width: 230px; max-width: 70%; height: auto;
    border-radius: 10px;
  }
  .tagline { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

  /* ---------- sticky toolbar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar-top {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 16px 6px;
    max-width: 760px; margin: 0 auto;
  }
  .search {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 14px; height: 40px;
  }
  .search svg { flex: none; opacity: .5; }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; width: 100%; min-width: 0;
  }
  .langs {
    display: flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; flex: none;
  }
  .langs button {
    border: 0; background: transparent; color: var(--muted);
    font: 800 12px/1 inherit; font-family: inherit;
    padding: 0 8px; height: 32px; border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--card); }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 6px 16px 10px; max-width: 760px; margin: 0 auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a {
    flex: none; text-decoration: none; white-space: nowrap;
    font-size: 14px; font-weight: 600; color: var(--ink);
    background: var(--chip); padding: 7px 14px; border-radius: 999px;
    transition: background .2s, color .2s;
  }
  .tabs a.active { background: var(--accent); color: var(--card); }

  /* ---------- content ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 40px; }
  section { margin-top: 26px; }
  h2 {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: .01em;
    color: var(--accent);
  }
  h2::before {
    content: ""; width: 6px; height: 22px; border-radius: 3px;
    background: linear-gradient(var(--teal), var(--olive), var(--purple));
  }
  .sec-note { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .sizes-head {
    display: flex; justify-content: flex-end; gap: 0;
    font-size: 12px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    padding: 0 14px 6px;
  }
  .sizes-head span { width: 64px; text-align: right; }

  .list {
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border-top: 1px solid var(--line);
  }
  .item:first-child { border-top: 0; }
  .item-main { flex: 1; min-width: 0; }
  .item-name {
    font-weight: 800; font-size: 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .item-desc { color: var(--muted); font-size: 14px; font-style: italic; margin-top: 2px; }
  .item-tr { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .item-info { color: var(--pink); font-size: 12.5px; margin-top: 3px; }
  .badge {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 999px; line-height: 1.5;
  }
  .ico { font-size: 14px; line-height: 1; }
  .b-star { background: var(--purple); color: #fff; }
  @media (prefers-color-scheme: dark) {
    .b-star { background: var(--accent); color: var(--card); }
  }

  .price {
    flex: none; font-weight: 800; font-variant-numeric: tabular-nums;
    white-space: nowrap; text-align: right;
  }
  .prices { display: flex; flex: none; }
  .prices .price { width: 64px; }
  .prices .price.big { color: var(--accent); }

  .footer-note {
    margin: 10px 2px 0; font-size: 13.5px; color: var(--muted);
  }
  .coperto {
    margin-top: 30px; padding: 14px; border-radius: 14px;
    background: var(--card); box-shadow: var(--shadow);
    display: flex; justify-content: space-between; font-weight: 800;
  }
  .legend {
    margin-top: 14px; font-size: 13px; color: var(--muted);
    display: flex; flex-direction: column; gap: 6px;
  }
  .legend div { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .empty {
    display: none; text-align: center; color: var(--muted); padding: 40px 0;
  }
  .hidden { display: none !important; }

  /* ---------- hint + filters ---------- */
  .pre { max-width: 760px; margin: 0 auto; padding: 14px 16px 0; }
  .hint { margin: 0; font-size: 13.5px; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    font: 600 13.5px/1.2 inherit; font-family: inherit;
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }

  /* ---------- selectable items ---------- */
  .item { cursor: pointer; transition: background .15s; -webkit-tap-highlight-color: transparent; }
  .item:active { background: var(--chip); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item.sel { box-shadow: inset 4px 0 0 var(--accent); }
  .qty {
    background: var(--accent); color: var(--card);
    font-size: 12px; font-weight: 800; border-radius: 999px; padding: 1px 8px;
  }

  /* ---------- floating list bar + back to top ---------- */
  .cart-bar {
    position: fixed; z-index: 20;
    left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    max-width: 736px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer;
    background: var(--purple); color: #fff;
    font: 800 16px/1.2 inherit; font-family: inherit;
    box-shadow: 0 8px 24px rgba(40, 20, 60, .3);
  }
  body.has-cart footer { padding-bottom: 100px; }
  .to-top {
    position: fixed; z-index: 19; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s, transform .2s;
  }
  .to-top.show { opacity: 1; pointer-events: auto; transform: none; }
  body.has-cart .to-top { bottom: calc(84px + env(safe-area-inset-bottom)); }

  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg);
    padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700;
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- bottom sheets ---------- */
  dialog.sheet {
    border: 0; padding: 0; margin: auto auto 0;
    width: 100%; max-width: 560px; max-height: 88vh;
    border-radius: 20px 20px 0 0; background: var(--card); color: var(--ink);
    display: none; flex-direction: column;
  }
  dialog.sheet[open] { display: flex; }
  dialog.sheet::backdrop { background: rgba(20, 10, 30, .45); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 12px 6px 18px; }
  .sheet-head h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .x { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 28px; line-height: 1; width: 44px; height: 44px; cursor: pointer; }
  .sheet-body { padding: 0 18px; overflow-y: auto; flex: 1; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .line:first-child { border-top: 0; }
  .line-name { flex: 1; min-width: 0; font-weight: 700; }
  .line-name small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .step { display: flex; align-items: center; gap: 4px; flex: none; }
  .step button {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: 800 18px/1 inherit; font-family: inherit;
  }
  .step span { min-width: 22px; text-align: center; font-weight: 800; }
  .line-total { flex: none; width: 64px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .list-empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .sheet-foot { padding: 12px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .sheet-note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; height: 46px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: 800 15px/1 inherit; font-family: inherit;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 18px calc(20px + env(safe-area-inset-bottom)); }
  .size-btn {
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 14px; padding: 16px 8px; cursor: pointer; font: inherit;
  }
  .size-btn b { display: block; font-size: 18px; }
  .size-btn span { color: var(--accent); font-weight: 800; font-size: 17px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .toast, .to-top { transition: none; }
  }

  footer {
    text-align: center; color: var(--muted); font-size: 12.5px;
    padding: 10px 16px 30px;
  }

  @media (max-width: 380px) {
    .prices .price { width: 54px; }
    .sizes-head span { width: 54px; }
    .langs button { padding: 0 6px; }
  }
</style>
</head>
<body>

<header class="hero">
  <img class="logo" src="logo.png" alt="Pizzeria Naveka" width="319" height="171">
  <p class="tagline" data-i18n="tagline"></p>
</header>

<div class="bar">
  <div class="bar-top">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="langs" role="group" aria-label="Lingua / Language">
      <button data-lang="it">IT</button>
      <button data-lang="en">EN</button>
      <button data-lang="tr">TR</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<div class="pre">
  <p class="hint" data-i18n="hint"></p>
  <div class="filters" id="filters" role="group"></div>
</div>

<main id="menu"></main>
<p class="empty" id="empty" data-i18n="empty"></p>

<main id="bottom" style="padding-top:0">
  <div class="coperto"><span data-i18n="coperto"></span><span id="coperto-price"></span></div>
  <div class="legend">
    <div><span>🌱 <span data-i18n="veg"></span></span><span>🌶️ <span data-i18n="hot"></span></span><span>🐟 <span data-i18n="sea"></span></span></div>
    <div data-i18n="frozen"></div>
    <div data-i18n="allergens"></div>
  </div>
</main>

<footer>Pizzeria Naveka · <span data-i18n="footer"></span></footer>

<button class="cart-bar hidden" id="cart-bar" type="button"><span id="cart-label"></span><span id="cart-sum"></span></button>
<button class="to-top" id="to-top" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="size-sheet">
  <div class="sheet-head"><h3 id="size-title"></h3><button class="x" type="button" data-close>×</button></div>
  <p class="sheet-note" style="padding:0 18px" data-i18n="chooseSize"></p>
  <div class="sizes" id="size-options"></div>
</dialog>

<dialog class="sheet" id="list-sheet">
  <div class="sheet-head"><h3 data-i18n="myList"></h3><button class="x" type="button" data-close>×</button></div>
  <div class="sheet-body" id="list-body"></div>
  <div class="sheet-foot">
    <div class="total"><span data-i18n="total"></span><span id="list-total"></span></div>
    <p class="sheet-note" data-i18n="listNote"></p>
    <div class="actions">
      <button class="btn" type="button" id="list-clear" data-i18n="clear"></button>
      <button class="btn primary" type="button" data-close data-i18n="close"></button>
    </div>
  </div>
</dialog>

<script src="menu-data.js"></script>

  var ICON = { veg: "🌱", hot: "🌶️", sea: "🐟" };

  var data = window.MENU;
  var menuEl = document.getElementById("menu");
  var tabsEl = document.getElementById("tabs");
  var qEl = document.getElementById("q");
  var lang = pickLang();
  var active = {};           // diet filters: { veg: true, ... }

  // every dish by "sectionId|name"
  var DISH = {};
  data.sections.forEach(function (sec) {
    sec.items.forEach(function (it) { DISH[sec.id + "|" + it.name] = { sec: sec, it: it }; });
  });

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem("naveka-lang"); } catch (e) {}
    var q = new URLSearchParams(location.search).get("lang");
    var nav = (navigator.language || "it").slice(0, 2).toLowerCase();
    if (UI[q]) return q;
    if (UI[saved]) return saved;
    // phones set to any other language (e.g. German, French) get English
    return UI[nav] ? nav : "en";
  }

  function euro(n) {
    return n.toFixed(2).replace(".", ",");
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function translateDesc(desc) {
    if (lang === "it" || !desc) return "";
    var i = LIDX[lang];
    if (ING[desc]) return ING[desc][i];
    var parts = desc.split(/\s*,\s*/);
    var out = [];
    for (var k = 0; k < parts.length; k++) {
      var t = ING[parts[k]];
      if (!t) return ""; // not a pure ingredient list
      out.push(t[i]);
    }
    return out.join(", ");
  }

  function badges(item) {
    var t = UI[lang], h = "";
    if (item.star) h += '<span class="badge b-star">' + t.star + "</span>";
    (item.tags || []).forEach(function (tag) {
      h += '<span class="ico" title="' + t[tag] + '" aria-label="' + t[tag] + '">' + ICON[tag] + "</span>";
    });
    return h;
  }

  function render() {
    var t = UI[lang];
    var html = "", tabs = "";

    data.sections.forEach(function (sec) {
      var title = sec.title[lang] || sec.title.it;
      tabs += '<a href="#' + sec.id + '" data-sec="' + sec.id + '">' + esc(title) + "</a>";

      html += '<section id="' + sec.id + '" data-sec="' + sec.id + '">';
      html += "<h2>" + esc(title) + "</h2>";
      if (sec.note) html += '<p class="sec-note">' + esc(sec.note[lang]) + "</p>";
      if (sec.sizes) {
        html += '<div class="sizes-head">' + sec.sizes.map(function (s) { return "<span>" + s + "</span>"; }).join("") + "</div>";
      }
      html += '<div class="list">';

      sec.items.forEach(function (it) {
        var sub = "";
        if (lang !== "it") {
          if (it.tr && it.tr[lang]) sub = it.tr[lang];
          else sub = translateDesc(it.desc);
        }
        var search = [it.name, it.desc, it.tr && it.tr.en, it.tr && it.tr.tr, translateDesc(it.desc)]
          .join(" ").toLowerCase();

        html += '<div class="item" tabindex="0" role="button" data-key="' + esc(sec.id + "|" + it.name) +
                '" data-tags="' + (it.tags || []).join(" ") + '" data-search="' + esc(search) + '">';
        html += '<div class="item-main">';
        html += '<div class="item-name">' + esc(it.name) + badges(it) + '<span class="qty hidden"></span></div>';
        if (it.desc) html += '<div class="item-desc">' + esc(it.desc) + "</div>";
        if (sub) html += '<div class="item-tr">' + esc(sub) + "</div>";
        if (it.info === "base") html += '<div class="item-info">' + esc(t.base) + "</div>";
        html += "</div>";

        if (it.prices) {
          html += '<div class="prices"><span class="price">' + euro(it.prices[0]) +
                  '</span><span class="price big">' + euro(it.prices[1]) + "</span></div>";
        } else {
          html += '<div class="price">' + euro(it.price) + "</div>";
        }
        html += "</div>";
      });

      html += "</div>";
      if (sec.footer) html += '<p class="footer-note">' + esc(sec.footer[lang]) + "</p>";
      html += "</section>";
    });

    menuEl.innerHTML = html;
    tabsEl.innerHTML = tabs;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t[el.getAttribute("data-i18n")];
    });
    qEl.placeholder = t.search;
    document.getElementById("coperto-price").textContent = data.currency + " " + euro(data.coperto);
    document.documentElement.lang = lang;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });

    document.getElementById("filters").innerHTML = ["veg", "hot", "sea"].map(function (tag) {
      return '<button type="button" data-tag="' + tag + '" aria-pressed="' + (active[tag] ? "true" : "false") + '">' +
             ICON[tag] + " " + t[tag] + "</button>";
    }).join("");
    document.getElementById("to-top").setAttribute("aria-label", t.toTop);

    filter();
    observe();
    refreshList();
  }

  function filter() {
    var q = qEl.value.trim().toLowerCase();
    var any = false;
    document.querySelectorAll("#menu section").forEach(function (sec) {
      var shown = 0;
      sec.querySelectorAll(".item").forEach(function (it) {
        var tags = it.getAttribute("data-tags").split(" ");
        var ok = (!q || it.getAttribute("data-search").indexOf(q) !== -1) &&
                 Object.keys(active).every(function (tag) { return !active[tag] || tags.indexOf(tag) !== -1; });
        it.classList.toggle("hidden", !ok);
        if (ok) shown++;
      });
      sec.classList.toggle("hidden", shown === 0);
      var tab = tabsEl.querySelector('[data-sec="' + sec.id + '"]');
      if (tab) tab.classList.toggle("hidden", shown === 0);
      if (shown) any = true;
    });
    document.getElementById("empty").style.display = any ? "none" : "block";
  }

  // highlight the tab of the section currently on screen
  var io;
  function observe() {
    if (!("IntersectionObserver" in window)) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var id = e.target.id;
        tabsEl.querySelectorAll("a").forEach(function (a) {
          var on = a.getAttribute("data-sec") === id;
          a.classList.toggle("active", on);
          if (on && a.scrollIntoView) {
            tabsEl.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
          }
        });
      });
    }, { rootMargin: "-130px 0px -65% 0px" });
    document.querySelectorAll("#menu section").forEach(function (s) { io.observe(s); });
  }

  // ---------- my list ----------
  // Kept only in this phone's browser, and forgotten after a few hours
  // so the next visit starts with an empty list.
  var LIST_KEY = "naveka-list", LIST_TTL = 6 * 3600 * 1000;
  var list = loadList();

  function loadList() {
    try {
      var s = JSON.parse(localStorage.getItem(LIST_KEY));
      if (s && s.lines && Date.now() - s.ts < LIST_TTL) return { lines: s.lines, people: s.people || 1 };
    } catch (e) {}
    return { lines: {}, people: 1 };
  }
  function saveList() {
    try { localStorage.setItem(LIST_KEY, JSON.stringify({ lines: list.lines, people: list.people, ts: Date.now() })); } catch (e) {}
  }

  // line key = "sectionId|name|sizeIndex" ("" when the dish has one price)
  function lineInfo(key) {
    var p = key.lastIndexOf("|");
    var d = DISH[key.slice(0, p)], size = key.slice(p + 1);
    if (!d) return null;
    return {
      name: d.it.name,
      size: size === "" ? "" : d.sec.sizes[+size],
      cents: Math.round((size === "" ? d.it.price : d.it.prices[+size]) * 100)
    };
  }

  function change(key, delta) {
    var n = (list.lines[key] || 0) + delta;
    if (n > 0) list.lines[key] = n; else delete list.lines[key];
    saveList();
    refreshList();
  }

  function refreshList() {
    var t = UI[lang], count = 0, cents = 0, perDish = {}, rows = "";
    Object.keys(list.lines).forEach(function (key) {
      var info = lineInfo(key), n = list.lines[key];
      if (!info) { delete list.lines[key]; return; }
      count += n; cents += n * info.cents;
      var dk = key.slice(0, key.lastIndexOf("|"));
      perDish[dk] = (perDish[dk] || 0) + n;
      rows += '<div class="line"><div class="line-name">' + esc(info.name) +
              (info.size ? "<small>" + info.size + " · " + euro(info.cents / 100) + "</small>" : "<small>" + euro(info.cents / 100) + "</small>") +
              '</div><div class="step"><button type="button" data-key="' + esc(key) + '" data-d="-1" aria-label="−">−</button><span>' + n +
              '</span><button type="button" data-key="' + esc(key) + '" data-d="1" aria-label="+">+</button></div>' +
              '<div class="line-total">' + euro(n * info.cents / 100) + "</div></div>";
    });

    var cover = Math.round(data.coperto * 100) * list.people;
    if (count) {
      rows += '<div class="line"><div class="line-name">' + esc(t.coperto) + "<small>" + euro(data.coperto) + " × " + list.people + " " + t.people + "</small></div>" +
              '<div class="step"><button type="button" data-people="-1" aria-label="−">−</button><span>' + list.people +
              '</span><button type="button" data-people="1" aria-label="+">+</button></div>' +
              '<div class="line-total">' + euro(cover / 100) + "</div></div>";
    } else {
      rows = '<p class="list-empty">' + esc(t.listEmpty) + "</p>";
    }
    document.getElementById("list-body").innerHTML = rows;
    document.getElementById("list-total").textContent = data.currency + " " + euro((count ? cents + cover : 0) / 100);

    var bar = document.getElementById("cart-bar");
    bar.classList.toggle("hidden", !count);
    document.body.classList.toggle("has-cart", !!count);
    document.getElementById("cart-label").textContent = "🧾 " + t.myList + " (" + count + ")";
    document.getElementById("cart-sum").textContent = data.currency + " " + euro((cents + cover) / 100);

    menuEl.querySelectorAll(".item").forEach(function (el) {
      var n = perDish[el.getAttribute("data-key")] || 0;
      var pill = el.querySelector(".qty");
      pill.textContent = "×" + n;
      pill.classList.toggle("hidden", !n);
      el.classList.toggle("sel", !!n);
    });
  }

  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function add(dishKey, size) {
    var d = DISH[dishKey];
    change(dishKey + "|" + (size === undefined ? "" : size), 1);
    toast("✓ " + UI[lang].added + ": " + d.it.name + (size === undefined ? "" : " · " + d.sec.sizes[size]));
  }

  function openDialog(dlg) {
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }
  function closeDialog(dlg) {
    if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
  }

  var sizeSheet = document.getElementById("size-sheet");
  var listSheet = document.getElementById("list-sheet");

  function pick(dishKey) {
    var d = DISH[dishKey];
    if (!d) return;
    if (!d.it.prices) { add(dishKey); return; }
    document.getElementById("size-title").textContent = d.it.name;
    document.getElementById("size-options").innerHTML = d.it.prices.map(function (p, i) {
      return '<button type="button" class="size-btn" data-size="' + i + '"><b>' + d.sec.sizes[i] + "</b><span>" +
             data.currency + " " + euro(p) + "</span></button>";
    }).join("");
    sizeSheet.setAttribute("data-dish", dishKey);
    openDialog(sizeSheet);
  }

  menuEl.addEventListener("click", function (e) {
    var el = e.target.closest(".item");
    if (el) pick(el.getAttribute("data-key"));
  });
  menuEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = e.target.closest(".item");
    if (!el) return;
    e.preventDefault();
    pick(el.getAttribute("data-key"));
  });

  document.getElementById("size-options").addEventListener("click", function (e) {
    var b = e.target.closest("[data-size]");
    if (!b) return;
    add(sizeSheet.getAttribute("data-dish"), +b.getAttribute("data-size"));
    closeDialog(sizeSheet);
  });

  document.getElementById("list-body").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-people")) {
      list.people = Math.max(1, list.people + +b.getAttribute("data-people"));
      saveList();
      refreshList();
    } else {
      change(b.getAttribute("data-key"), +b.getAttribute("data-d"));
    }
  });

  document.getElementById("list-clear").addEventListener("click", function () {
    if (!Object.keys(list.lines).length || confirm(UI[lang].confirmClear)) {
      list = { lines: {}, people: 1 };
      saveList();
      refreshList();
      closeDialog(listSheet);
    }
  });

  document.getElementById("cart-bar").addEventListener("click", function () { openDialog(listSheet); });

  [sizeSheet, listSheet].forEach(function (dlg) {
    dlg.addEventListener("click", function (e) {
      // close buttons, or a tap on the dimmed backdrop
      if (e.target.closest("[data-close]") || e.target === dlg) closeDialog(dlg);
    });
  });

  // ---------- filters + back to top ----------
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tag]");
    if (!b) return;
    var tag = b.getAttribute("data-tag");
    active[tag] = !active[tag];
    b.setAttribute("aria-pressed", active[tag] ? "true" : "false");
    filter();
  });

  var topBtn = document.getElementById("to-top");
  window.addEventListener("scroll", function () {
    topBtn.classList.toggle("show", window.scrollY > 900);
  }, { passive: true });
  topBtn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("naveka-lang", lang); } catch (e) {}
      render();
    });
  });
  qEl.addEventListener("input", filter);

  render();
})();
</script>
</body>
</html>
