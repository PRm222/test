<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveka · QR per i tavoli</title>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito+Sans:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root { --teal: #4f9e97; --olive: #9da536; --purple: #4b2a7b; --pink: #c9546f; --lime: #8fb832; --chili: #8e1f1f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #e9e5df; color: #221b2b;
    font-family: "Nunito Sans", system-ui, sans-serif;
  }
  .tools {
    max-width: 210mm; margin: 16px auto; padding: 0 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    font-size: 14px;
  }
  .tools button {
    font: 800 14px inherit; font-family: inherit; border: 0; border-radius: 999px;
    background: var(--purple); color: #fff; padding: 10px 18px; cursor: pointer;
  }
  .sheet {
    width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  .card {
    border: 1px dashed #d8d2ca;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10mm 8mm; text-align: center;
  }
  .word { display: flex; border-radius: 3px; overflow: hidden; }
  .word b {
    font-family: "Kaushan Script", cursive; font-weight: 400; color: #fff;
    font-size: 30px; line-height: 48px; padding: 0 5px;
  }
  .word b:nth-child(1) { background: var(--teal); padding-left: 12px; }
  .word b:nth-child(2) { background: var(--olive); }
  .word b:nth-child(3) { background: var(--purple); padding-right: 12px; }
  .stripe { display: flex; width: 60mm; height: 3px; margin: 7mm 0 5mm; }
  .stripe i { flex: 1; }
  .stripe i:nth-child(1) { background: var(--teal); }
  .stripe i:nth-child(2) { background: var(--olive); }
  .stripe i:nth-child(3) { background: var(--purple); }
  .stripe i:nth-child(4) { background: var(--chili); }
  .stripe i:nth-child(5) { background: var(--pink); }
  .stripe i:nth-child(6) { background: var(--lime); }
  h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--purple); }
  .langs { margin: 3px 0 0; font-size: 12.5px; color: #6e6677; }
  .qr { width: 58mm; height: 58mm; margin: 6mm 0 4mm; }
  .url { font-size: 11px; color: #6e6677; word-break: break-all; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .tools { display: none; }
    .sheet { margin: 0; }
  }
  @media screen and (max-width: 820px) {
    .sheet { width: 100%; min-height: 0; grid-template-columns: 1fr; }
    .card:nth-child(n+2) { display: none; }
  }
</style>
</head>
<body>
  <div class="tools">
    <button onclick="window.print()">Stampa / Yazdır</button>
    <span>Foglio A4 con 4 cartoncini da tavolo (A6). · A4 sayfada 4 adet masa kartı (A6).</span>
  </div>

  <div class="sheet" id="sheet"></div>

  <template id="tpl">
    <div class="card">
      <div class="word"><b>na</b><b>ve</b><b>ka</b></div>
      <div class="stripe"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Scansiona il menù</h1>
      <p class="langs">Scan for the menu · Speisekarte scannen · Menü için okutun</p>
      <img class="qr" src="qr-menu.svg" alt="QR code menù">
      <div class="url"></div>
    </div>
  </template>

  <script>
    // deve corrispondere all'URL usato in tools/make_qr.py
    var url = "https://prm222.github.io/test/";
    var tpl = document.getElementById("tpl");
    var sheet = document.getElementById("sheet");
    for (var i = 0; i < 4; i++) {
      var c = tpl.content.cloneNode(true);
      c.querySelector(".url").textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
      sheet.appendChild(c);
    }
  </script>
</body>
</html>
